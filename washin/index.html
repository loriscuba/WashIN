<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WashIN — Login</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230D9488'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='Arial,sans-serif' font-weight='800' font-size='18'>W</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/WashIN/washin/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide/dist/lucide.min.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="login-card">
        <div class="brand">
          <h1>WashIN</h1>
          <p>Gestionale impresa di pulizie</p>
        </div>

        <form id="login-form" class="login-form">
          <label>
            Email
            <input type="email" id="email" name="email" placeholder="es. nome@azienda.it" required>
          </label>

          <label>
            Password
            <input type="password" id="password" name="password" placeholder="Inserisci la password" required>
          </label>

          <button type="submit" class="button action">Accedi</button>

          <a href="#" class="forgot" id="forgot-link">Password dimenticata?</a>

          <p id="error-msg" class="error" aria-live="polite"></p>
        </form>

        <!-- Reset password panel (hidden by default) -->
        <div id="reset-panel" style="display:none;margin-top:16px;">
          <form id="reset-form" class="login-form">
            <p style="font-size:14px;color:#374151;margin:0 0 14px;">
              Inserisci la tua email e ti invieremo un link per reimpostare la password.
            </p>
            <label>
              Email
              <input type="email" id="reset-email" name="reset_email" placeholder="es. nome@azienda.it" required>
            </label>
            <button type="submit" class="button action">Invia link di reset</button>
            <a href="#" class="forgot" id="back-to-login">← Torna al login</a>
            <p id="reset-msg" class="error" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>

    <script src="js/config.js"></script>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
