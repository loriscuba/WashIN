<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WashIN — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide/dist/lucide.min.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="login-card">
        <div class="brand">
          <h1>WashIN</h1>
          <p>Gestionale impresa di pulizie</p>
        </div>

        <form id="login-form" class="login-form">
          <label>
            Email
            <input type="email" id="email" name="email" placeholder="es. nome@azienda.it" required>
          </label>

          <label>
            Password
            <input type="password" id="password" name="password" placeholder="Inserisci la password" required>
          </label>

          <button type="submit" class="button action">Accedi</button>

          <a href="#" class="forgot">Password dimenticata?</a>

          <p id="error-msg" class="error" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="js/config.loader.js"></script>
    <script type="module">
      async function initWashIN() {
        try {
          await loadConfig();
          await import('./js/auth.js');
        } catch (error) {
          console.error(error);
        }
      }
      initWashIN();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/lucide/dist/lucide.min.js"></script>
  </body>
</html>
